<!DOCTYPE html>
<html>
<head>
    <title>IGNOU Term-End Result</title>
</head>
<body style="background-color: #ffffff; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif;">
    <div id="wrapper" style="min-height: 100vh; display: flex; flex-direction: column;">
        
        <!-- TOP BLUE HEADER (REAL HTML) -->
        <div id="header" style="background-color: #144e8c; width: 100%; padding: 15px 0;">
            <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td width="15%" align="center" valign="middle">
                        <a href="../www.ignou.ac.in/index.html"><img src="images/LOGO1.png" alt="IGNOU" width="130" /></a>
                    </td>
                    <td width="70%" align="center" style="line-height: 1.3;">
                        <span style="color:White;font-family:'Times New Roman', Times, serif;font-size:26px;font-weight:bold;">INDIRA GANDHI NATIONAL OPEN UNIVERSITY</span><br/>
                        <span style="color:White;font-family:'Times New Roman', Times, serif;font-size:18px;font-weight:bold;">TERM END EXAM / REEVALUATION RESULTS</span><br/>
                        <!-- REAL LOGOUT BUTTON -->
                        <button style="margin-top:10px; padding:3px 20px; font-weight:bold; background-color:#cccccc; border:1px solid #999; cursor:pointer; font-size:11px; font-family:Arial, Helvetica, sans-serif; color: #000;" onclick="window.history.back()">Logout</button>
                    </td>
                    <td width="15%" align="center" valign="middle">
                        <img src="images/naac_TRANS.PNG" alt="NAAC" width="140" />
                    </td>
                </tr>
            </table>
        </div>
        
        <!-- MIDDLE PART (THE SCREENSHOT) -->
        <div style="flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 20px 0;">
            
            <div style="position: relative; display: inline-block; width: 95%; max-width: 1200px;">
                <!-- THE USER'S SCREENSHOT OF THE WHITE BOX -->
                <img src="final_result.png" alt="Result Screenshot" style="width: 100%; height: auto; display: block; border: 1px solid #ccc;" onerror="this.onerror=null; this.src='result.png'; this.alt='Please save your screenshot as final_result.png in this folder!';" />

                <!-- INVISIBLE CLICKABLE PRINT BUTTON (Enormous area to guarantee a hit) -->
                <div onclick="window.print()" title="Print Result" style="position: absolute; top: 10%; right: 0%; width: 25%; height: 25%; background: transparent; cursor: pointer; z-index: 10;">
                </div>
                
            </div>

        </div>
        
        <!-- BOTTOM BLUE FOOTER (REAL HTML) -->
        <div style="background-color:#144e8c; color:white; font-size:12px; padding:8px 20px; display:flex; justify-content:space-between; font-family:Arial, sans-serif;">
            <div>Indira Gandhi National Open University. All Rights Reserved.</div>
            <div>Designed, Developed and Maintained by SDC, Computer Divison.</div>
        </div>
        
    </div>
</body>
</html>

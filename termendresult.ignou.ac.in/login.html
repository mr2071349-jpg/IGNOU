    <script language="javascript" type="text/javascript">

        function CandLogin_Validator(salt) {

            var error = 0;
            if (document.getElementById("txtEnrno").value == "") {
                document.getElementById("sptxtEnrno").textContent = "Enrolment No is required!";
                //alert('Enrollment no. should not be blank...');
                //document.getElementById("txtEnrno").focus();
                //return false;
                error = error + 1;

            }
            else {
                document.getElementById("sptxtEnrno").textContent = "";
            }



            if (document.getElementById("ddlProgram").value == "0") {
                document.getElementById("SpddlProgram").textContent = "Programme code is required!";
                error = error + 1;

            }
            else {
                document.getElementById("SpddlProgram").textContent = "";
            }

            if (document.getElementById("txtPassword").value == "") {
                document.getElementById("SptxtPassword").textContent = "Password required!";
                error = error + 1;

            }
            else {
                document.getElementById("SptxtPassword").textContent = "";
            }



            if (document.getElementById("ddlApplyingFor").value == "0") {
                document.getElementById("SpddlApplyingFor").textContent = "Select Applying For from the List";
                error = error + 1;

            }
            else {
                document.getElementById("SpddlApplyingFor").textContent = "";
            }

            if (document.getElementById("txtSecureCode").value == "") {
                document.getElementById("SptxtSecureCode").innerHTML = "Enter secure code";
                error = error + 1;

            }
            else {
                document.getElementById("SptxtSecureCode").innerHTML = "";
            }

            if (error == 0) {
                document.getElementById("txtPassword").value = (hex_md5(document.getElementById("txtPassword").value)).toUpperCase();
                document.getElementById("txtPassword").value = (hex_md5(document.getElementById("txtPassword").value + salt)).toUpperCase();
                return true;
            }
            else {
                return false;
            }
        }

    </script>
